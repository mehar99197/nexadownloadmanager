    <title>Nexa Download Manager</title>

    <!--
      First-run boot screen.

      It has to be here, inline, and not in React: the point is to be on screen
      while the 440 kB bundle is still downloading, and a React component cannot
      render until that bundle has arrived — by which time there is nothing left
      to wait for. Same reason the CSS is inline rather than a class from
      index.css: in `npm run dev` that stylesheet arrives as a JS module, so a
      shared class would be unstyled exactly when it is needed.

      Hidden by default. It is shown only when the script below adds
      `.ndm-booting`, so a crawler, a reader with JS off, or a browser where
      that script throws sees no overlay at all rather than a permanent one.

      It costs nothing on a slow connection, and nothing at all on in-site
      navigation, which never reloads the document. On a fast one it costs
      nothing either: the overlay does not begin to appear for 160 ms, and a
      warm load is removed before that, so it is never seen rather than seen
      briefly.
    -->
    <style>
      #ndm-boot { display: none; }

      html.ndm-booting { overflow: hidden; }
      html.ndm-booting #ndm-boot {
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #04060d;
        /* Held back, not shown and then held. A warm load is painted well
           inside this delay, so the overlay is removed while it is still
           fully transparent and the reader sees no boot screen at all —
           which is the right amount of boot screen for a page that was
           already in the cache. A cold load is nowhere near ready at
           160 ms, so it gets the screen exactly as before. The number is
           repeated as SHOW_AT in the script below; keep the two in step. */
        opacity: 0;
        animation: ndm-boot-appear 200ms ease 160ms forwards;
      }
      html.ndm-booting[data-theme="light"] #ndm-boot { background: #f6f7fb; }
      /* Replaces the fade-in rather than fighting it: swapping the animation
         out would drop opacity back to 0 in a single frame. */
      html.ndm-booting #ndm-boot[data-leaving="1"] {
        animation: ndm-boot-leave 320ms ease forwards;
      }
      @keyframes ndm-boot-appear { to { opacity: 1; } }
      @keyframes ndm-boot-leave { from { opacity: 1; } to { opacity: 0; } }

      /* Same two arcs as components/Spinner.jsx, and the same two theme stops:
         #63dcff / #d09bff on dark, #1f56b8 / #6b3bc4 on light. Restated rather
         than shared, for the reason in the comment above. */
      #ndm-boot .track { stroke: #63dcff; stroke-opacity: 0.16; }
      #ndm-boot .from { stop-color: #63dcff; }
      #ndm-boot .to { stop-color: #d09bff; }
      #ndm-boot .inner { stroke: #63dcff; stroke-opacity: 0.5; }
      html[data-theme="light"] #ndm-boot .track,
      html[data-theme="light"] #ndm-boot .inner { stroke: #1f56b8; }
      html[data-theme="light"] #ndm-boot .from { stop-color: #1f56b8; }
      html[data-theme="light"] #ndm-boot .to { stop-color: #6b3bc4; }

      #ndm-boot .arc {
        transform-origin: 50% 50%;
        animation: ndm-boot-march 1.5s ease-in-out infinite,
                   ndm-boot-turn 2s linear infinite;
      }
      #ndm-boot .inner {
        transform-origin: 50% 50%;
        animation: ndm-boot-turn 1.15s linear infinite reverse;
      }
      @keyframes ndm-boot-turn { to { transform: rotate(360deg); } }
      @keyframes ndm-boot-march {
        0%   { stroke-dasharray: 1 152;  stroke-dashoffset: 0; }
        50%  { stroke-dasharray: 92 152; stroke-dashoffset: -30; }
        100% { stroke-dasharray: 1 152;  stroke-dashoffset: -151; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ndm-boot .arc, #ndm-boot .inner {
          animation: ndm-boot-breathe 2.2s ease-in-out infinite;
        }
        #ndm-boot .arc { stroke-dasharray: 62 152; }
      }
      @keyframes ndm-boot-breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>

    <script>
      (function () {
        var html = document.documentElement;

        /* Stamp the saved theme before the first paint. useTheme does this in an
           effect, which runs only after the bundle has parsed and React has
           rendered — so until now a reader on the light theme got a full dark
           page first and a flash to white afterwards, on every single load. The
           key, the values and the "dark needs no attribute" rule are
           hooks/useTheme.js's; keep the two in step. */
        var theme = 'system';
        try { theme = localStorage.getItem('ndm_theme') || 'system'; } catch (e) { /* storage blocked */ }
        var resolved = theme === 'light' || theme === 'dark'
          ? theme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (resolved === 'light') html.setAttribute('data-theme', 'light');
        html.style.colorScheme = resolved;

        /* Shown on every full page load, which in a single-page app means
           exactly the moment it is for: arriving at the site, following a link
           in from outside, or reloading. Moving around inside the site never
           reloads the document, so navigation stays instant — that is the
           "after the first time" half of it.

           This used to be gated on a localStorage flag, one boot screen per
           browser for ever. It worked, and it was the wrong idea: measured at
           959 ms on the live bytes and then never again, so the one person who
           most needs to see it — whoever is judging the site — cannot. A gate
           nobody can reopen is indistinguishable from a screen that does not
           work. Losing the flag also loses the branch where blocked storage
           meant no boot screen at all. */
        html.className += ' ndm-booting';

        var started = Date.now();
        var SHOW_AT = 160;      /* the animation-delay above: nothing is on
                                   screen before this */
        var MIN_VISIBLE = 260;  /* once it IS on screen, long enough to read
                                   as a screen rather than as a flicker */
        var MAX_MS = 8000;      /* nothing may leave the reader stuck behind it */
        var done = false;

        function finish(immediate) {
          if (done) return;
          done = true;
          var boot = document.getElementById('ndm-boot');
          var drop = function () {
            html.className = html.className.replace(' ndm-booting', '');
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          };
          if (!boot || immediate === true) { drop(); return; }
          boot.setAttribute('data-leaving', '1');
          setTimeout(drop, 340);
        }

        /* React calls this once it has painted (see src/main.jsx).

           The old rule held the screen for a flat 700 ms whatever happened,
           which on a warm cache meant staring at a spinner over a page that
           had finished. The floor now applies to the time the screen is
           actually VISIBLE, and the fast path skips it entirely: below
           SHOW_AT the overlay is still transparent, so there is nothing to
           fade and nothing was ever seen. A cold load is unaffected — the
           measured 959 ms boot is past the floor before it is consulted. */
        window.__ndmBootDone = function () {
          var spent = Date.now() - started;
          if (spent <= SHOW_AT) { finish(true); return; }
          setTimeout(finish, Math.max(0, SHOW_AT + MIN_VISIBLE - spent));
        };
        /* And this runs whatever happens — a failed chunk, a thrown module, a
           browser that never fires the call above. A boot screen that can
           outlive the boot is worse than no boot screen. */
        setTimeout(finish, MAX_MS);
        window.addEventListener('error', function () { setTimeout(finish, 400); });
      })();
    </script>
  </head>
  <body>
    <div id="ndm-boot" role="status" aria-label="Loading Nexa Download Manager">
      <svg width="56" height="56" viewBox="0 0 50 50" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="ndm-boot-grad" x1="0" y1="0" x2="1" y2="1">
            <stop class="from" offset="0%" />
            <stop class="to" offset="100%" />
          </linearGradient>
        </defs>
        <circle class="track" cx="25" cy="25" r="21" stroke-width="4" />
        <circle class="arc" cx="25" cy="25" r="21" stroke="url(#ndm-boot-grad)" stroke-width="4" stroke-linecap="round" />
        <circle class="inner" cx="25" cy="25" r="13" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 68" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
