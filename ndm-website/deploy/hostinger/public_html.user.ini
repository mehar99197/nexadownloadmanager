; public_html/.user.ini — PHP overrides for the /api proxy (api-proxy.php).
;
; Hostinger runs PHP as lsphp: `php_value` lines in .htaccess cause a 500,
; so per-directory PHP settings belong here (or hPanel -> PHP Configuration,
; which writes this same file). Changes apply within user_ini.cache_ttl,
; 300 seconds by default.

; A 1 GB installer PUT at a modest uplink takes many minutes. The host may
; still clamp these below what is written here — see deployment notes.
max_execution_time = 3600
max_input_time = 3600

; The installer upload is a raw PUT and PHP's post_max_size only governs POST
; bodies, but set both high so no PHP-side ceiling ever bites first.
; MAX_RELEASE_UPLOAD_MB in the backend (1024) remains the real limit.
post_max_size = 1100M
upload_max_filesize = 1100M

; Streaming proxy: PHP must never buffer or compress output, or forwarded
; Content-Length headers and 206 byte-range responses would be broken.
output_buffering = Off
zlib.output_compression = Off

; The proxy moves data in 64 KB chunks; this is headroom, not a requirement.
memory_limit = 256M

; Never leak PHP errors into API responses.
display_errors = Off
log_errors = On
