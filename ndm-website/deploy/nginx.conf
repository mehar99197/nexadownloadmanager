# Nexa website — TLS termination, static hosting, API reverse proxy.
#
# Certificates come from certbot (see deploy/README.md). Everything under /api
# goes to the Node container; everything else is a static SPA.

upstream nexa_api {
    server api:3001;
    keepalive 16;
}

# Plain HTTP exists only to answer the ACME challenge and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name nexadownloadmanager.com www.nexadownloadmanager.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexadownloadmanager.com www.nexadownloadmanager.com;

    ssl_certificate     /etc/letsencrypt/live/nexadownloadmanager.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexadownloadmanager.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://nexa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app's TRUST_PROXY must match this chain, or rate limiting and the
        # admin IP allowlist would see nginx's address instead of the client's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Stripe posts a signed raw body here; no buffering games.
    location = /api/webhooks/stripe {
        proxy_pass http://nexa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ---- Staff admin SPA (never indexed) ------------------------------------
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- Creator SPA (same bundle, separate mount; never indexed) -----------
    # One build serves both panels: it reads the URL to decide which one to
    # render, and its assets stay under /admin/ (the Vite `base`), which is why
    # the fallback below points at /admin/index.html. This is presentation only
    # — /api/root is gated by its own token family, so serving the creator HTML
    # to an anonymous visitor gives them a login form and nothing else.
    location = /root { return 301 /root/; }
    location /root/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- Public SPA ---------------------------------------------------------
    root /srv/frontend;
    index index.html;

    # Fingerprinted assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
