# Nexa website — production stack.
#
#   cp backend/.env.example backend/.env   # then fill in the real secrets
#   docker compose up -d --build
#
# The API refuses to start in production with default/missing secrets, which is
# deliberate: a misconfigured deploy fails loudly instead of running insecurely.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-ndm_prod}
      MYSQL_USER: ${MYSQL_USER:-ndm}
      MYSQL_PASSWORD: ${MYSQL_PASS:?set MYSQL_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:?set MYSQL_ROOT_PASS in .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published: only the API talks to it.
    expose:
      - "3306"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/app/backups
    expose:
      - "3001"

  # Applies the schema and any pending migrations, then exits. Runs before the
  # API serves traffic on every deploy.
  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "src/scripts/migrate.js"]
    restart: "no"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/srv/frontend:ro
      - admin-dist:/srv/admin:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # Build-only services: they populate the static volumes nginx serves, then exit.
  frontend-build:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SITE_URL: ${PUBLIC_URL:-https://nexadownloadmanager.com}
        VITE_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
    command: ["sh", "-c", "cp -r /dist/. /out/"]
    volumes:
      - frontend-dist:/out
    restart: "no"

  admin-build:
    build:
      context: ./admin
      args:
        VITE_API_URL: /api
    command: ["sh", "-c", "cp -r /dist/. /out/"]
    volumes:
      - admin-dist:/out
    restart: "no"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew twice a day; nginx picks up the new cert on its next reload.
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # Nightly: verified DB dump, then the trial-ending reminder mails.
  cron:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/app/backups
    entrypoint: >
      sh -c "while :; do
               sleep 86400;
               bash src/scripts/backup.sh /app/backups || echo 'backup failed';
               node src/scripts/sendTrialReminders.js || echo 'reminders failed';
             done"
    restart: unless-stopped

volumes:
  db-data:
  backups:
  frontend-dist:
  admin-dist:
  certbot-conf:
  certbot-www:
